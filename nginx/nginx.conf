worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # DNS interno de Docker: si un nodo se recrea con otra IP, NGINX la vuelve a resolver
    # (y el gateway puede arrancar aunque uno de los nodos esté caído).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # Log con evidencia del balanceo y del failover: a qué nodo(s) fue cada petición.
    log_format cluster '$remote_addr [$time_local] "$request" $status '
                       'upstream=$upstream_addr upstream_status=$upstream_status '
                       'node=$upstream_http_x_handled_by_node rt=$request_time';
    access_log /var/log/nginx/access.log cluster;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------- clúster backend
    # Round-Robin (algoritmo por defecto). Failover pasivo: un nodo que falla 1 vez
    # (error de conexión, timeout o 5xx) se excluye durante 10 s.
    upstream backend_cluster {
        zone backend_cluster 64k;
        server backend-node-1:8000 max_fails=1 fail_timeout=10s resolve;
        server backend-node-2:8000 max_fails=1 fail_timeout=10s resolve;
        keepalive 16;
    }

    # Estado interno del gateway para el panel de monitoreo. Puerto 8081 SÓLO dentro de la red de
    # Docker (no se publica ni lo enruta Traefik): los nodos lo leen en http://gateway:8081/nginx_status.
    server {
        listen 8081;
        server_name _;
        access_log off;
        location = /nginx_status {
            stub_status;
        }
        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;  # los pedidos son JSON pequeños

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ------------------------------------------------------------ API -> nodos
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            # Si un nodo cae o responde 5xx (p. ej. 503 de SIMULATE_CRASH) se reintenta en el otro.
            # non_idempotent también reintenta POST/PATCH: es seguro porque la creación usa un
            # UUID del cliente (idempotente), los PATCH fijan valores y DELETE es idempotente.
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 15s;

            # Los 401/403/409 NO se reintentan: son respuestas válidas, no fallos del nodo.

            # Evidencia para el dashboard: "503, 200" = el primer nodo falló y respondió el otro.
            # (No se expone $upstream_addr: revelaría IPs internas de la red Docker.)
            add_header X-Upstream-Status $upstream_status always;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }

        # ------------------------------------------------------------ React (build estático)
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            # CSP estricta: el build de Vite no usa scripts ni estilos en línea.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
