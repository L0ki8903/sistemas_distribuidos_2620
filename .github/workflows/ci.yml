# Integración continua del Sistema Distribuido de Gestión de Pedidos.
#
#   backend           pytest en Python 3.11 con dos SQLite temporales (primaria/réplica)
#   backend-postgres  la misma suite contra dos PostgreSQL 16 reales (service containers)
#   frontend          build de producción de React + Vite
#   cluster           docker compose completo (5 contenedores) + pytest e2e vía NGINX
#                     + prueba de interfaz con Chrome (capturas como artefacto)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest (Python 3.11 + SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -v

  backend-postgres:
    name: Backend · pytest (PostgreSQL 16 real)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db-primary:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: orders_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d orders_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      db-replica:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: orders_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d orders_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_PRIMARY_DB_URL: postgresql://admin:secretpassword@localhost:5432/orders_test
      TEST_REPLICA_DB_URL: postgresql://admin:secretpassword@localhost:5433/orders_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: pytest contra PostgreSQL
        run: python -m pytest -v tests/test_orders.py tests/test_auth.py tests/test_monitoring.py tests/test_admin.py

  frontend:
    name: Frontend · build (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  cluster:
    name: Clúster Docker · e2e + interfaz
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # docker compose toma estas variables del entorno; son sólo para el clúster efímero de CI.
      ADMIN_PASSWORD: Admin-CI-2026
      JWT_SECRET: ci-only-jwt-secret-${{ github.run_id }}-0123456789abcdef
    steps:
      - uses: actions/checkout@v5

      - name: Construir y levantar el clúster (espera a que esté healthy)
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Estado de los contenedores
        run: docker compose ps

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias de pruebas
        run: pip install -r backend/requirements-dev.txt

      - name: pytest e2e contra NGINX (Round-Robin, caída de nodo, failover de BD)
        working-directory: backend
        env:
          CLUSTER_BASE_URL: http://localhost:8080
          CLUSTER_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: python -m pytest -v tests/test_cluster_e2e.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e-ui/package-lock.json
      - name: Prueba de interfaz con Chrome (login, operación, caídas, monitoreo y cliente)
        working-directory: e2e-ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
          UI_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          node ui-test.mjs "$RUNNER_TEMP/capturas"

      - name: Subir capturas de la interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz
          path: ${{ runner.temp }}/capturas
          if-no-files-found: ignore

      - name: Logs del clúster (si algo falló)
        if: failure()
        run: docker compose logs --tail=150

      - name: Apagar el clúster
        if: always()
        run: docker compose down -v
